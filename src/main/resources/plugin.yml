name: SHAreneTP
version: '${project.version}'
main: org.Cry_Legende.sHAreneTP.SHAreneTP
api-version: '1.20'
author: Cry_Legende

commands:
  shatp:
    description: Teleport to a random arena location.
    usage: "/shatp <player>"
    permission: sharenetp.admin
  shatpadd:
    description: Add current location to arena locations.
    usage: "/shatp add"
    permission: sharenetp.admin
